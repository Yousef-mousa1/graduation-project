<app-auth-layout>
  <header class="head">
    <span class="head-icon">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.lock" /></svg>
      <span class="head-dot"></span>
    </span>
    <h2 class="head-title">Forgot Password?</h2>
    <p class="body-sm text-muted">
      Enter your corporate email and we will issue a cryptographically signed recovery token.
    </p>
  </header>

  <form class="form" (submit)="onSubmit($event)" novalidate>
    <div class="field">
      <div class="field-row">
        <label class="field-label" for="forgot-email">Work Email Address</label>
        <span class="micro accent-text">SSO Supported</span>
      </div>
      <div class="input-wrap">
        <input
          class="input has-start"
          id="forgot-email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="alex@example.com"
        />
        <svg class="ic input-icon start" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.atSign" /></svg>
      </div>
    </div>

    <p class="note">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.info" /></svg>
      Recovery requests expire after 15 minutes. Please also check your spam or quarantine folder.
    </p>

    <button class="btn btn-primary btn-lg btn-block" type="submit">
      Send Reset Link
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.arrow" /></svg>
    </button>
  </form>

  <div authFooter class="foot">
    <a class="back" routerLink="/login">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.arrowLeft" /></svg>
      Back to Sign In
    </a>
    <nav class="legal caption" aria-label="Legal">
      <a href="#">Privacy Policy</a>
      <span aria-hidden="true">•</span>
      <a href="#">Incident Desk</a>
      <span aria-hidden="true">•</span>
      <a href="#">Compliance</a>
    </nav>
  </div>
</app-auth-layout>
